<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Tookoo - Solusi Kasir Cerdas, Cepat, dan Mandiri untuk Toko &amp; UMKM"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tookoo - Aplikasi Kasir Cerdas Toko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('tookoo-theme') || 'light';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

      // Global safety net for mobile debugging
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          var errDiv = document.createElement('div');
          errDiv.style.cssText =
            'padding: 24px; font-family: sans-serif; text-align: center; color: #ef4444;';
          errDiv.innerHTML =
            '<h3>Memuat Aplikasi...</h3><p style="font-size: 12px; color: #64748b;">Jika layar tidak berubah, silakan segarkan peramban Anda.</p>';
          root.appendChild(errDiv);
        }
      });
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
